<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeie Sag | Lokalt sagbruk på Skeie i Lindesnes</title>

    <meta name="description"
          content="Skeie Sag – lokalt sagbruk på Skeie i Lindesnes. Nettsiden er under arbeid. Ta gjerne kontakt på telefon eller e-post.">

    <!-- Denne siden er frittstående og bruker ikke styles.css.
         Alt av stil ligger i <style> under. -->

    <style>

        :root {
            --green-dark: #203d31;
            --wood-light: #c8a57c;
            --white: #ffffff;

            --serif: Georgia, "Times New Roman", serif;
            --sans: Arial, Helvetica, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            background:
                linear-gradient(
                    to bottom,
                    rgba(20, 38, 30, 0.62),
                    rgba(20, 38, 30, 0.88)
                ),
                url("images/AvstandsbildeSnekkerbod.jpg") center / cover no-repeat;
            background-color: var(--green-dark);

            color: var(--white);
            font-family: var(--sans);
            line-height: 1.7;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 24px;
            text-align: center;
        }

        .placeholder {
            max-width: 560px;
        }

        .logo-main {
            display: block;

            font-family: var(--serif);
            font-size: clamp(2.4rem, 7vw, 3.4rem);
            font-weight: 700;
            line-height: 1.1;
        }

        .logo-subtitle {
            display: block;
            margin-top: 12px;

            color: var(--wood-light);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .divider {
            width: 60px;
            height: 2px;
            margin: 34px auto;

            background: var(--wood-light);
        }

        .message {
            font-size: 1.15rem;
        }

        .message strong {
            display: block;
            margin-bottom: 10px;

            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .contact {
            margin-top: 38px;

            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 28px;

            font-size: 1rem;
            font-weight: 700;
        }

        .contact a {
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.35);
            padding-bottom: 2px;

            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .contact a:hover,
        .contact a:focus-visible {
            color: var(--wood-light);
            border-color: var(--wood-light);
        }

    </style>
</head>

<body>

    <div class="placeholder">

        <span class="logo-main">Skeie Sag</span>
        <span class="logo-subtitle">Etablert 1981</span>

        <div class="divider"></div>

        <p class="message">
            <strong>Informasjon kommer</strong>
            Vi holder på med nettsiden. Ta gjerne kontakt
            i mellomtiden.
        </p>

        <div class="contact">

            <a href="tel:+4740009098">40 00 90 98</a>

            <a href="mailto:post@skeiesag.no">post@skeiesag.no</a>

            <a href="https://www.instagram.com/skeie_sag/"
               target="_blank"
               rel="noopener">@skeie_sag</a>

        </div>

    </div>

</body>
</html>
